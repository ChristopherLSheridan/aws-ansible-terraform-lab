name: Terraform Deployment

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    deployment-check:
        name: Verify Deployment OIDC Identity
        runs-on: ubuntu-latest
        environment: lab

        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Inspect OIDC claims
              shell: bash
              run: |
                  python3 - <<'PY'
                  import os
                  import json
                  import base64
                  import urllib.request

                  url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"

                  req = urllib.request.Request(
                      url,
                      headers={
                          "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
                      }
                  )

                  with urllib.request.urlopen(req) as response:
                      token = json.load(response)["value"]

                  payload = token.split(".")[1]
                  payload += "=" * (-len(payload) % 4)
                  claims = json.loads(base64.urlsafe_b64decode(payload))

                  for key in ("iss", "aud", "sub", "repository", "ref", "event_name"):
                      print(f"{key}: {claims.get(key)}")
                  PY
