name: Terraform Deployment

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    deployment-check:
        name: Verify Deployment OIDC Identity
        runs-on: ubuntu-latest
        environment: lab

        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Inspect OIDC claims
              shell: bash
              run: |
                  python3 - <<'PY'
                  import os
                  import json
                  import base64
                  import urllib.request

                  url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"

                  req = urllib.request.Request(
                      url,
                      headers={
                          "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
                      }
                  )

                  with urllib.request.urlopen(req) as response:
                      token = json.load(response)["value"]

                  payload = token.split(".")[1]
                  payload += "=" * (-len(payload) % 4)
                  claims = json.loads(base64.urlsafe_b64decode(payload))

                  for key in ("iss", "aud", "sub", "repository", "ref", "event_name"):
                      print(f"{key}: {claims.get(key)}")
                  PY

            - name: Authenticate to AWS
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: arn:aws:iam::844274145888:role/GitHubActionsTerraformDeploy
                  aws-region: us-east-2

            - name: Verify AWS identity
              run: aws sts get-caller-identity

            - name: Set up Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: 1.16.2

            - name: Initialize Terraform backend
              working-directory: terraform
              run: terraform init -input=false

            - name: List Terraform state resources
              working-directory: terraform
              run: Terraform state list
